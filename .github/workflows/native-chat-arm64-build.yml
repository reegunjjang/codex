name: Native Chat Codex ARM64 build

on:
  workflow_dispatch:
    inputs:
      bwrap_sha256:
        description: SHA-256 of the ARM64 bwrap bundled in the target installation
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Cross-build Linux ARM64 CLI and helper
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET: aarch64-unknown-linux-gnu
      CODEX_BWRAP_SHA256: ${{ inputs.bwrap_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure CI build environment
        uses: ./.github/actions/setup-ci

      - name: Set a version for this local build
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          version="0.164.0+native-chat.${GITHUB_SHA:0:7}"
          python3 - "$version" Cargo.toml <<'PY'
          from pathlib import Path
          import re
          import sys

          version, manifest = sys.argv[1:]
          path = Path(manifest)
          text = path.read_text()
          text, count = re.subn(
              r'(?m)(^\[workspace\.package\]\nversion\s*=\s*)"[^"]+"',
              lambda match: f'{match.group(1)}"{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update [workspace.package].version")
          path.write_text(text)
          PY
          cargo update --workspace
          echo "CODEX_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install ARM64 GNU cross compiler
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Configure cross-compilation tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CODEX_BWRAP_SHA256" =~ ^[a-f0-9]{64}$ ]]
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: Configure Rusty V8 for ARM64 GNU
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-unknown-linux-gnu

      - name: Build ARM64 Codex binaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          cargo build --target "$TARGET" --release --bin codex --bin codex-code-mode-host

      - name: Validate binary architecture and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${CARGO_TARGET_DIR}/${TARGET}/release"
          stage_dir="${RUNNER_TEMP}/codex-native-chat-arm64"
          mkdir -p "$stage_dir"
          cp "${release_dir}/codex" "${release_dir}/codex-code-mode-host" "$stage_dir/"
          for binary in "$stage_dir/codex" "$stage_dir/codex-code-mode-host"; do
            file "$binary"
            readelf -h "$binary" | grep -Eq 'Machine:.*AArch64'
          done
          printf 'version=%s\ntarget=%s\nsource=%s\nbwrap_sha256=%s\n' \
            "$CODEX_VERSION" "$TARGET" "$GITHUB_SHA" "$CODEX_BWRAP_SHA256" \
            > "$stage_dir/build-info.txt"
          (cd "$stage_dir" && sha256sum codex codex-code-mode-host build-info.txt > SHA256SUMS)

      - name: Upload ARM64 binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-native-chat-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/codex-native-chat-arm64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
