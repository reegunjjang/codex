name: Native Chat Codex ARM64 package

on:
  push:
    branches:
      - codex/native-chat-completions-subagents
    paths:
      - "codex-rs/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/native-chat-arm64-build.yml"
      - "scripts/codex_package/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test ARM64 Linux package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build and smoke-test Codex packages
        uses: ./.github/actions/build-codex-packages
        with:
          target: aarch64-unknown-linux-musl
          package-version: 0.164.0-native-chat.${{ github.run_number }}
          build-mode: release
          build-system: cargo

      - name: Upload ARM64 packages and symbols
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-native-chat-arm64-${{ github.sha }}
          path: |
            dist/aarch64-unknown-linux-musl/*
            symbols-dist/aarch64-unknown-linux-musl/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
